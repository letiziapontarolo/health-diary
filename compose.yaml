services:
  postgres:
    image: postgres:17
    container_name: health-diary-postgres

    environment:
      POSTGRES_DB: health_diary
      POSTGRES_USER: health_diary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_diary -d health_diary"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: