# Application
spring.application.name=health-diary
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/health_diary
spring.datasource.username=health_diary
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Documents
app.documents.storage-path=${DOCUMENTS_STORAGE_PATH:../health-diary-storage/documents}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
